<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EDF0E6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Gracie's Garden">
<meta name="format-detection" content="telephone=no">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%BF%3C/text%3E%3C/svg%3E">
<title>Gracie's Garden</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;1,9..144,500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">

<style>
/* ---------- Tokens ---------- */
:root{
  --bg:#EDF0E6; --bg-2:#E4E9DA;
  --surface:#FBFCF8; --surface-2:#F2F5EC;
  --ink:#232B1E; --ink-soft:#5A6551; --ink-faint:#8A9382;
  --primary:#3B6B41; --primary-deep:#274A2B; --primary-soft:#E1EBDD;
  --earth:#93714C; --earth-soft:#EFE6D8;
  --bloom:#C15C77; --bloom-soft:#F6E3E7;
  --water:#3B79A8; --water-soft:#DEEBF2;
  --feed:#B0801F; --feed-soft:#F1E7CE;
  --border:#D5DCC8; --border-soft:#E4E9DA;
  --shadow:rgba(30,50,25,.10); --shadow-lg:rgba(30,50,25,.16);
  --font-display:"Fraunces","Noto Serif TC",Georgia,serif;
  --font-serif:"Noto Serif TC","Fraunces",Georgia,"PingFang TC",serif;
  --font-sans:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
  --maxw:760px;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%; scrollbar-gutter:stable; overflow-x:hidden}

body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:var(--font-sans); font-size:16.5px; line-height:1.7;
  -webkit-font-smoothing:antialiased; letter-spacing:.005em;
  padding-bottom:calc(92px + env(safe-area-inset-bottom));
  overflow-x:hidden; max-width:100%;
}
.app{max-width:var(--maxw); margin:0 auto; padding:0 16px}

/* ---------- Header ---------- */
header.site{
  position:sticky; top:0; z-index:40;
  background:color-mix(in srgb,var(--bg) 86%, transparent);
  backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  border-bottom:1px solid var(--border-soft);
}
.site-in{max-width:var(--maxw); margin:0 auto; padding:12px 16px calc(12px); display:flex; align-items:center; gap:12px}
header.site{padding-top:env(safe-area-inset-top)}
.brand{display:flex; align-items:center; gap:11px; min-width:0}
.brand .mark{width:34px; height:34px; flex:none}
.brand .txt{min-width:0}
.brand .en{font-family:var(--font-display); font-style:italic; font-weight:500; font-size:19px; line-height:1; color:var(--primary-deep); letter-spacing:.01em}
.brand .zh{font-size:12px; color:var(--ink-faint); letter-spacing:.14em; margin-top:3px}
.spacer{flex:1}
.icon-btn{
  width:40px; height:40px; border-radius:50%; border:1px solid var(--border);
  background:var(--surface); color:var(--ink-soft); cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; font-size:17px;
  transition:background .15s, color .15s, border-color .15s;
}
.icon-btn:hover{background:var(--surface-2); color:var(--primary)}

svg, img, canvas{max-width:100%}
.wx-trend{width:100%; height:auto; display:block}

/* ---------- Views ---------- */
.view{display:none; padding:18px 0 8px; animation:rise .4s ease both}
.view.active{display:block}
@keyframes rise{from{opacity:0; transform:translateY(8px)} to{opacity:1; transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important; transition:none!important; scroll-behavior:auto!important}}

.eyebrow{font-size:12px; letter-spacing:.18em; text-transform:uppercase; color:var(--primary); font-weight:700; margin:0 0 6px}
h2.section{font-family:var(--font-serif); font-weight:700; font-size:24px; line-height:1.3; margin:0 0 4px; text-wrap:balance; color:var(--ink)}
.section-sub{color:var(--ink-soft); margin:0 0 16px; font-size:14.5px}

/* ---------- Season hero ---------- */
.season{
  position:relative; overflow:hidden; border-radius:22px; margin-top:16px;
  background:linear-gradient(150deg,var(--primary-deep),var(--primary) 130%);
  color:#F3F7EE; padding:22px 22px 20px; box-shadow:0 10px 30px var(--shadow);
}
.season .sky{position:absolute; inset:0; opacity:.9; pointer-events:none}
.season-top{display:flex; align-items:baseline; gap:12px; position:relative}
.season .mo{font-family:var(--font-display); font-weight:600; font-size:52px; line-height:.9; letter-spacing:-.01em}
.season .mo small{font-size:20px; font-weight:500; margin-left:2px}
.season .name{font-family:var(--font-serif); font-weight:700; font-size:22px}
.season .tag{margin-top:2px; font-size:13px; opacity:.85; letter-spacing:.04em}
.season .desc{position:relative; margin:14px 0 0; font-size:14.5px; line-height:1.65; opacity:.96; max-width:52ch}
.season .weatherline{position:relative; display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.wchip{background:rgba(255,255,255,.16); border:1px solid rgba(255,255,255,.22); color:#fff; padding:5px 11px; border-radius:999px; font-size:12.5px; display:inline-flex; gap:6px; align-items:center}

/* ---------- 近日天氣 hero ---------- */
.season.wxsig-rain{background:linear-gradient(150deg,#25485B,#3B79A8 135%)}
.season.wxsig-dryhot{background:linear-gradient(150deg,#8A5622,#C9822F 135%)}
.season.wxsig-cold{background:linear-gradient(150deg,#2B3B4F,#4C6784 135%)}
.wx-now{position:relative; display:flex; align-items:baseline; gap:10px; flex-wrap:wrap}
.wx-temp{font-family:var(--font-display); font-weight:600; font-size:50px; line-height:.92; letter-spacing:-.01em}
.wx-temp .u{font-size:23px; font-weight:500}
.wx-cond{font-family:var(--font-sans); font-weight:600; font-size:15.5px; opacity:.96; align-self:center}
.wx-lo{font-size:13px; opacity:.85; font-weight:500; align-self:center}
.wx-feel{align-self:center; font-size:13.5px; opacity:.95; letter-spacing:.02em}
.wx-feel b{font-size:20px; font-weight:600; margin-left:3px}
.wxi{display:inline-block; vertical-align:middle; width:1.5em; height:1.5em; flex:none}
.wx-now2{position:relative; display:flex; align-items:stretch; margin-top:2px}
.wx-half{flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center; text-align:center; padding:2px 6px}
.wx-half+.wx-half{border-left:1px solid rgba(255,255,255,.28)}
.wx-cond{display:flex; align-items:center; justify-content:center; gap:7px; margin-top:12px}
.wx-cond .wxi{width:24px; height:24px}
.wx-cell .ic{margin:4px 0 3px; line-height:0}
.wx-cell .ic .wxi{width:31px; height:31px}
.wx-bigdeco{position:absolute; top:-14px; right:-12px; width:112px; height:112px; opacity:.28; pointer-events:none; filter:drop-shadow(0 4px 7px rgba(20,28,16,.14))}
.wx-bigdeco .wxi{width:100%; height:100%}
.wx-trendwrap{position:relative; margin-top:16px}
.wx-trendcap{font-size:11.5px; opacity:.82; letter-spacing:.08em; margin-bottom:4px}
.wx-trend{width:100%; height:auto; display:block; overflow:visible}
.wx-trend text{font-family:var(--font-sans)}
.wx-trend .tr-hi{font-size:12px; font-weight:700; fill:#fff}
.wx-trend .tr-lo{font-size:10.5px; font-weight:500; fill:rgba(255,255,255,.72)}
.wx-trend .tr-day{font-size:10.5px; fill:rgba(255,255,255,.9)}
.wx-trend .tr-pop{font-size:10px; fill:rgba(255,255,255,.82)}
.wx-sub{position:relative; margin-top:5px; font-size:13.5px; opacity:.92; letter-spacing:.02em; text-align:center}
.wx-advice{position:relative; margin-top:14px; font-size:14.5px; line-height:1.55; padding:12px 15px; border-radius:14px; background:rgba(255,255,255,.17); border:1px solid rgba(255,255,255,.26)}
.wx-advice b{font-weight:700}
.wx-strip{position:relative; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; margin-top:14px}
.wx-cell{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.16); border-radius:12px; padding:8px 3px 7px; text-align:center; line-height:1.2}
.wx-cell.today{background:rgba(255,255,255,.24); border-color:rgba(255,255,255,.42)}
.wx-cell .wd{font-size:11px; opacity:.82}
.wx-cell .ic{font-size:18px; margin:4px 0 3px}
.wx-cell .hl{font-size:12.5px; font-weight:700}
.wx-cell .hl .lo{opacity:.7; font-weight:500}
.wx-cell .pp{font-size:10px; opacity:.85; margin-top:3px; letter-spacing:.02em}
.wx-foot{position:relative; margin-top:13px; font-size:11px; opacity:.8; line-height:1.5; display:flex; flex-wrap:wrap; gap:4px 10px}
.doline .wxn{font-size:13px; margin-top:3px; display:flex; gap:5px; align-items:flex-start}
.doline .wxn.rain{color:var(--water)}
.doline .wxn.dryhot{color:var(--feed)}
.doline .wxn.cold{color:var(--water)}

/* ---------- Cards ---------- */
.card{background:var(--surface); border:1px solid var(--border); border-radius:18px; box-shadow:0 2px 10px var(--shadow); overflow:hidden}
.stack{display:flex; flex-direction:column; gap:14px}
.todo-head{display:flex; align-items:center; gap:10px; margin:26px 0 12px}
.todo-head h3{font-family:var(--font-serif); font-size:19px; margin:0; font-weight:700}
.todo-head .count{font-size:12.5px; color:var(--ink-faint); background:var(--surface-2); border:1px solid var(--border-soft); padding:2px 9px; border-radius:999px}

/* task item */
.task{display:flex; gap:13px; padding:15px 16px; align-items:flex-start}
.task + .task{border-top:1px solid var(--border-soft)}
.task .pic{position:relative; width:46px; height:46px; border-radius:12px; flex:none; background:var(--surface-2); border:1px solid var(--border-soft); overflow:hidden}
.task .pic svg{width:100%; height:100%; display:block}
.task .body{flex:1; min-width:0}
.task .nm{font-weight:700; font-size:16px; color:var(--ink); display:flex; align-items:center; gap:8px; flex-wrap:wrap}
.task .lines{margin-top:5px; display:flex; flex-direction:column; gap:5px}
.doline{display:flex; gap:8px; font-size:14px; line-height:1.5; color:var(--ink-soft); align-items:flex-start}
.doline .k{flex:none; width:20px; text-align:center; padding-top:1px}
.doline b{color:var(--ink); font-weight:500}

/* semantic pills */
.pill{display:inline-flex; align-items:center; gap:5px; font-size:12px; font-weight:700; padding:3px 9px; border-radius:999px; letter-spacing:.02em; white-space:nowrap}
.pill.water{background:var(--water-soft); color:var(--water)}
.pill.feed{background:var(--feed-soft); color:var(--feed)}
.pill.bloom{background:var(--bloom-soft); color:var(--bloom)}
.pill.ok{background:var(--primary-soft); color:var(--primary)}
.pill.warn{background:var(--feed-soft); color:var(--feed)}
.pill.due{background:var(--water-soft); color:var(--water)}
.pill.ghost{background:var(--surface-2); color:var(--ink-faint); font-weight:500}

/* quick actions */
.qacts{display:flex; gap:8px; margin-top:11px; flex-wrap:wrap}
.qbtn{border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:11px; padding:7px 12px; font-size:13px; font-weight:600; cursor:pointer; font-family:var(--font-sans); display:inline-flex; align-items:center; gap:6px; transition:.15s}
.qbtn:hover{border-color:var(--primary); color:var(--primary); background:var(--surface-2)}
.qbtn.did{background:var(--primary-soft); border-color:transparent; color:var(--primary)}
.lastcare{font-size:12px; color:var(--ink-soft); margin:9px 2px 1px}
.lastcare b{font-weight:600; color:var(--ink)}
.btn-waterall{margin-left:auto; border:none; background:var(--water); color:#fff; border-radius:12px; padding:9px 15px; font-size:13.5px; font-weight:700; cursor:pointer; font-family:var(--font-sans); display:inline-flex; align-items:center; gap:6px; white-space:nowrap; box-shadow:0 2px 8px rgba(59,121,168,.28); transition:.15s}
.btn-waterall:hover{background:#31688f}
.btn-waterall:active{transform:translateY(1px)}
.due-banner{background:var(--water-soft); border:1px solid var(--water); border-radius:16px; padding:15px 16px 16px; margin:22px 0 2px}
.due-banner .db-top{display:flex; align-items:center; gap:8px; color:var(--water); font-family:var(--font-serif)}
.due-banner .db-top b{font-size:16px; font-weight:700}
.due-banner .db-ic{font-size:18px}
.due-banner .db-list{margin:9px 0 13px; display:flex; flex-wrap:wrap; gap:7px}
.due-banner .dp{background:var(--surface); border:1px solid var(--water); color:var(--ink); border-radius:999px; padding:4px 11px; font-size:13px; font-weight:600; display:inline-flex; align-items:center; gap:5px}
.due-banner .dp .dd{color:var(--water); font-size:11.5px; font-weight:600}
.due-banner .db-btn{margin-left:0; width:100%; justify-content:center; padding:11px}
.garden-head{margin:2px 0 14px}
.btn-cal-export{width:100%; border:1px dashed var(--water); background:var(--water-soft); color:var(--water); border-radius:13px; padding:12px; font-size:14px; font-weight:700; cursor:pointer; font-family:var(--font-sans); display:flex; align-items:center; justify-content:center; gap:7px; transition:.15s}
.btn-cal-export:hover{background:#d3e6f0}
.cal-list{display:flex; flex-direction:column; gap:11px}
.cal-row{display:flex; align-items:center; gap:12px; justify-content:space-between; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:14px; padding:13px 14px}
.cal-info{min-width:0}
.cal-when{font-weight:700; color:var(--ink); font-size:14.5px; margin-bottom:3px}
.cal-plants{font-size:12.5px; color:var(--ink-soft); line-height:1.5}
.btn-gcal{flex:none; text-decoration:none; background:var(--water); color:#fff; border-radius:10px; padding:9px 13px; font-size:13px; font-weight:700; white-space:nowrap; box-shadow:0 2px 8px rgba(59,121,168,.26)}
.btn-gcal:hover{background:#31688f}
.fcard{background:transparent; border:none; padding:0; margin-bottom:26px}
.sgrid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:13px; margin-top:14px}
.scard{background:var(--surface); border:1px solid var(--border); border-radius:14px; overflow:hidden; box-shadow:0 2px 8px var(--shadow); display:flex; flex-direction:column}
.scard .stop{aspect-ratio:1/.82; position:relative; background:var(--surface-2); overflow:hidden}
.scard .spimg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; object-position:center 55%; display:block}
.scard .stop.noimg{display:flex; align-items:center; justify-content:center; font-size:40px}
.scard .smeta{padding:10px 12px 12px}
.scard .snm{font-family:var(--font-serif); font-weight:700; font-size:15.5px; color:var(--ink); line-height:1.28}
.scard .sone{font-size:12px; color:var(--ink-soft); margin-top:6px; line-height:1.55}
.fhead{display:flex; align-items:center; gap:12px}
.fsym{flex:none; min-width:40px; height:40px; padding:0 9px; border-radius:20px; background:var(--fc); color:#fff; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:15px; font-family:var(--font-sans)}
.fname{font-family:var(--font-serif); font-weight:700; font-size:18px; color:var(--ink)}
.frole{font-size:12.5px; color:var(--ink-soft); margin-top:2px; line-height:1.4}
.ffor{font-size:12.5px; color:var(--fc); background:color-mix(in srgb,var(--fc) 12%,transparent); border-radius:9px; padding:6px 11px; margin:12px 0; font-weight:600}
.fsrcs{display:flex; flex-direction:column; gap:11px}
.fsrc{display:flex; gap:10px; align-items:flex-start}
.fsrc .fe{flex:none; font-size:19px; width:26px; text-align:center; line-height:1.3}
.fsrc b{font-size:14px; color:var(--ink); display:block; margin-bottom:1px}
.fsrc .fu{font-size:12.5px; color:var(--ink-soft); line-height:1.55; display:block}
.fglance{margin:0 0 18px}
.fglance-h{font-family:var(--font-serif); font-weight:700; font-size:17px; color:var(--ink); margin:0 0 11px}
.fgrid{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.ftile{background:color-mix(in srgb,var(--fc) 9%,var(--surface)); border:1px solid color-mix(in srgb,var(--fc) 32%,transparent); border-top:3px solid var(--fc); border-radius:14px; padding:12px 13px}
.ft-head{display:flex; align-items:center; gap:8px; margin-bottom:8px}
.fsym.sm{min-width:30px; height:30px; font-size:13px; padding:0 7px; border-radius:15px}
.ft-name{font-family:var(--font-serif); font-weight:700; font-size:16.5px; color:var(--ink)}
.ft-eff{font-size:13px; color:var(--ink); font-weight:600; margin-bottom:9px}
.ft-src{display:flex; gap:6px; align-items:center; font-size:21px; line-height:1}
.ft-src .ftmini{width:27px; height:27px; border-radius:7px; object-fit:cover; box-shadow:0 1px 2px var(--shadow)}
.fsrc .fthumb{flex:none; width:48px; height:48px; border-radius:10px; object-fit:cover; background:var(--surface-2); box-shadow:0 1px 3px var(--shadow)}
.fglance-note{font-size:11.5px; color:var(--ink-faint); margin-top:10px; line-height:1.55}
.fdetail-h{font-family:var(--font-serif); font-weight:700; font-size:16px; color:var(--ink); margin:22px 0 12px}
.qbtn.wa:hover{border-color:var(--water); color:var(--water)}
.qbtn.fe:hover{border-color:var(--feed); color:var(--feed)}

/* ---------- Empty state ---------- */
.empty{text-align:center; padding:40px 22px; border:1.5px dashed var(--border); border-radius:20px; background:var(--surface-2)}
.empty svg{width:74px; height:74px; margin:0 auto 6px; display:block; opacity:.9}
.empty h3{font-family:var(--font-serif); margin:6px 0 6px; font-size:19px}
.empty p{color:var(--ink-soft); margin:0 auto 18px; font-size:14.5px; max-width:34ch}

/* buttons */
.btn{display:inline-flex; align-items:center; justify-content:center; gap:8px; border-radius:13px; padding:12px 20px; font-family:var(--font-sans); font-size:15px; font-weight:700; cursor:pointer; border:1px solid transparent; transition:.16s; text-decoration:none}
.btn-primary{background:var(--primary); color:#fff; box-shadow:0 4px 14px var(--shadow)}
.btn-primary:hover{background:var(--primary-deep); box-shadow:0 6px 18px var(--shadow-lg); transform:translateY(-1px)}
.btn-soft{background:var(--surface); color:var(--primary); border-color:var(--border)}
.btn-soft:hover{background:var(--surface-2); border-color:var(--primary)}
.btn-lg{padding:14px 24px; font-size:16px}
.btn-block{width:100%}

/* ---------- Garden grid ---------- */
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:13px}
.pcard{position:relative; background:var(--surface); border:1px solid var(--border); border-radius:16px; overflow:hidden; cursor:pointer; text-align:left; padding:0; font-family:var(--font-sans); color:inherit; transition:.16s; box-shadow:0 2px 8px var(--shadow)}
.pcard:hover{transform:translateY(-3px); box-shadow:0 10px 22px var(--shadow-lg); border-color:var(--primary)}
.pcard .top{aspect-ratio:1/.82; background:radial-gradient(120% 120% at 50% 15%,var(--surface-2),var(--bg-2)); position:relative; overflow:hidden}
.pcard .top svg{position:absolute; inset:0; width:100%; height:100%}
.pcard .cat{position:absolute; top:9px; left:9px; font-size:11px; font-weight:700; padding:3px 8px; border-radius:999px; background:color-mix(in srgb,var(--surface) 85%,transparent); color:var(--primary); border:1px solid var(--border-soft); backdrop-filter:blur(4px)}
.pcard .meta{padding:11px 13px 13px}
.pcard .meta .nm{font-family:var(--font-serif); font-weight:700; font-size:16.5px; line-height:1.25}
.pcard .meta .al{font-size:12px; color:var(--ink-faint); margin-top:2px}
.pcard .meta .one{font-size:12.5px; color:var(--ink-soft); margin-top:7px; line-height:1.45; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.pcard .state{display:flex; gap:5px; flex-wrap:wrap; padding:0 13px 12px}
.pcard.inmine::after{content:"✓ 我的"; position:absolute; top:9px; right:9px; font-size:10.5px; font-weight:700; color:#fff; background:var(--primary); padding:3px 8px; border-radius:999px}

/* filter chips */
.chips{display:flex; gap:8px; overflow-x:auto; padding:4px 2px 14px; margin:0 -2px; scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none; border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); padding:8px 15px; border-radius:999px; font-size:13.5px; font-weight:600; cursor:pointer; font-family:var(--font-sans); transition:.15s; white-space:nowrap}
.chip:hover{border-color:var(--primary); color:var(--primary)}
.chip.on{background:var(--primary); border-color:var(--primary); color:#fff}
.search{width:100%; padding:12px 15px; border:1px solid var(--border); border-radius:13px; background:var(--surface); color:var(--ink); font-family:var(--font-sans); font-size:15.5px; margin-bottom:12px; -webkit-appearance:none; box-shadow:0 2px 8px var(--shadow)}
.search::placeholder{color:var(--ink-faint)}
.search:focus{outline:none; border-color:var(--primary); box-shadow:0 0 0 3px var(--primary-soft)}

/* ---------- Identify wizard ---------- */
.wizard{background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:0 4px 16px var(--shadow); padding:22px 20px 24px}
.wsteps{display:flex; gap:6px; margin-bottom:20px}
.wdot{height:5px; flex:1; border-radius:999px; background:var(--border)}
.wdot.on{background:var(--primary)}
.wq{font-family:var(--font-serif); font-weight:700; font-size:20px; margin:0 0 4px; text-wrap:balance}
.wq-sub{color:var(--ink-soft); font-size:14px; margin:0 0 18px}
.opts{display:grid; grid-template-columns:1fr 1fr; gap:11px}
.opt{display:flex; flex-direction:column; align-items:center; gap:8px; text-align:center; border:1.5px solid var(--border); background:var(--surface); border-radius:15px; padding:16px 10px; cursor:pointer; font-family:var(--font-sans); color:var(--ink); transition:.15s}
.opt:hover{border-color:var(--primary); background:var(--surface-2)}
.opt.sel{border-color:var(--primary); background:var(--primary-soft); box-shadow:inset 0 0 0 1px var(--primary)}
.opt .ico{width:46px; height:46px}
.opt .lb{font-weight:600; font-size:14.5px; line-height:1.3}
.opt .lb small{display:block; font-weight:400; color:var(--ink-faint); font-size:11.5px; margin-top:2px}
.opt .ck{position:absolute}
.opt.color{flex-direction:row; justify-content:flex-start; gap:11px; padding:13px 14px}
.opt.color .sw{width:26px; height:26px; border-radius:50%; flex:none; border:1px solid rgba(0,0,0,.15)}
.wnav{display:flex; gap:10px; margin-top:20px}
.wnav .btn{flex:1}
.wskip{background:none; border:none; color:var(--ink-faint); font-size:13px; cursor:pointer; text-decoration:underline; text-underline-offset:3px; font-family:var(--font-sans); padding:8px}
.wtip{margin-top:16px; font-size:13px; color:var(--ink-soft); background:var(--water-soft); border:1px solid color-mix(in srgb,var(--water) 25%,transparent); border-radius:12px; padding:11px 14px; line-height:1.55}
.wtip b{color:var(--water)}
.match-hd{display:flex; align-items:baseline; justify-content:space-between; margin:0 0 12px}
.match-hd .n{font-size:13px; color:var(--ink-faint)}
.matchbar{height:6px; border-radius:999px; background:var(--border-soft); overflow:hidden; margin-top:9px}
.matchbar i{display:block; height:100%; background:linear-gradient(90deg,var(--primary),var(--primary-deep)); border-radius:999px}

/* ---------- Modal ---------- */
.scrim{position:fixed; inset:0; background:rgba(20,28,16,.5); backdrop-filter:blur(3px); z-index:60; opacity:0; pointer-events:none; transition:opacity .25s; display:flex; align-items:flex-end; justify-content:center}
.scrim.show{opacity:1; pointer-events:auto}
.sheet{position:relative; width:100%; max-width:640px; max-height:92%; transform:translateY(100%); background:var(--bg); border-radius:24px 24px 0 0; box-shadow:0 -12px 40px var(--shadow-lg); overflow:hidden; display:flex; flex-direction:column; transition:transform .32s cubic-bezier(.2,.8,.2,1)}
.sheet.show{transform:translateY(0)}
.sheet-scroll{overflow-y:auto; -webkit-overflow-scrolling:touch}
.sheet .hero{position:relative; padding:22px 20px 18px; background:linear-gradient(160deg,var(--surface-2),var(--bg-2)); border-bottom:1px solid var(--border-soft)}
.sheet .grip{position:absolute; top:9px; left:50%; transform:translateX(-50%); width:42px; height:5px; border-radius:999px; background:var(--border)}
.sheet .close{position:absolute; top:14px; right:14px}
.sheet .hero-row{display:flex; gap:16px; align-items:center; margin-top:6px}
.sheet .portrait{position:relative; width:88px; height:88px; flex:none; border-radius:18px; background:radial-gradient(120% 120% at 50% 20%,var(--surface),var(--bg-2)); border:1px solid var(--border-soft); overflow:hidden}
.sheet .portrait svg{width:100%; height:100%}
.sheet h2{font-family:var(--font-serif); font-size:25px; margin:0; font-weight:700; line-height:1.15}
.sheet .al{color:var(--ink-faint); font-size:13.5px; margin-top:3px}
.sheet .badges{display:flex; gap:7px; flex-wrap:wrap; margin-top:10px}
.dbody{padding:18px 20px 26px; display:flex; flex-direction:column; gap:20px}
.dsec .h{display:flex; align-items:center; gap:9px; margin:0 0 10px}
.dsec .h .di{width:30px; height:30px; border-radius:9px; display:inline-flex; align-items:center; justify-content:center; flex:none; font-size:15px}
.dsec .h h4{font-family:var(--font-serif); font-size:17px; margin:0; font-weight:700}
.dsec p{margin:0 0 8px; font-size:14.5px; line-height:1.65; color:var(--ink-soft)}
.dsec p b, .dsec li b{color:var(--ink); font-weight:600}
.di.wa{background:var(--water-soft); color:var(--water)}
.di.fe{background:var(--feed-soft); color:var(--feed)}
.di.id{background:var(--earth-soft); color:var(--earth)}
.di.bl{background:var(--bloom-soft); color:var(--bloom)}
.di.tp{background:var(--primary-soft); color:var(--primary)}

/* seasonal water table */
.wtab{display:grid; grid-template-columns:repeat(5,1fr); gap:7px; margin-top:4px}
.wcell{background:var(--surface); border:1px solid var(--border-soft); border-radius:12px; padding:9px 8px; text-align:center}
.wcell .s{font-size:11.5px; color:var(--ink-faint); font-weight:600; letter-spacing:.04em}
.wcell .drops{margin:5px 0 4px; font-size:12px; letter-spacing:1px; height:14px; color:var(--water)}
.wcell .fq{font-size:11.5px; color:var(--ink-soft); line-height:1.3}
.wcell.hot{border-color:color-mix(in srgb,var(--water) 40%,transparent); background:var(--water-soft)}

/* fertilizer timeline */
.ftl{display:flex; gap:3px; margin-top:6px}
.fmo{flex:1; text-align:center}
.fmo .bar{height:26px; border-radius:6px; background:var(--surface-2); border:1px solid var(--border-soft); position:relative}
.fmo.act .bar{background:var(--feed); border-color:var(--feed)}
.fmo .ml{font-size:9.5px; color:var(--ink-faint); margin-top:3px}
.fmo.act .ml{color:var(--feed); font-weight:700}
.callout{font-size:13.5px; line-height:1.6; border-left:3px solid var(--earth); background:var(--earth-soft); padding:10px 13px; border-radius:0 10px 10px 0; color:var(--ink-soft)}
.callout.warn{border-color:var(--feed); background:var(--feed-soft)}
.dbody ul{margin:0; padding-left:18px; display:flex; flex-direction:column; gap:6px}
.dbody li{font-size:14.5px; line-height:1.6; color:var(--ink-soft)}
.src{font-size:11.5px; color:var(--ink-faint); border-top:1px solid var(--border-soft); padding-top:12px; line-height:1.5}
.dcta{position:sticky; bottom:0; background:color-mix(in srgb,var(--bg) 92%,transparent); backdrop-filter:blur(8px); border-top:1px solid var(--border-soft); padding:12px 20px; display:flex; gap:10px}
.dcta .btn{flex:1}
.log-note{font-size:12px; color:var(--ink-faint); text-align:center; margin-top:2px}

/* ---------- Bottom nav ---------- */
nav.tabs{position:fixed; left:0; right:0; bottom:0; z-index:50; background:color-mix(in srgb,var(--bg) 90%,transparent); backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); border-top:1px solid var(--border-soft); padding:8px 10px calc(8px + env(safe-area-inset-bottom))}
.tabs-in{max-width:var(--maxw); margin:0 auto; display:grid; grid-template-columns:repeat(4,1fr); gap:4px}
.tab .ci{fill:transparent}
.tab{display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 4px; border:none; background:none; cursor:pointer; color:var(--ink-faint); font-family:var(--font-sans); font-size:11px; font-weight:600; border-radius:12px; transition:.15s}
.tab svg{width:23px; height:23px}
.tab.on{color:var(--primary)}
.tab.on .ci{fill:var(--primary-soft)}
.tab:hover{color:var(--primary)}

/* toast */
.toast{position:fixed; left:50%; bottom:104px; transform:translate(-50%,20px); z-index:80; background:var(--primary-deep); color:#fff; padding:11px 20px; border-radius:999px; font-size:14px; font-weight:600; box-shadow:0 8px 24px var(--shadow-lg); opacity:0; pointer-events:none; transition:.28s; display:flex; align-items:center; gap:8px}
.toast.show{opacity:1; transform:translate(-50%,0)}

.foot{text-align:center; color:var(--ink-faint); font-size:12px; padding:22px 10px 8px; line-height:1.7}
.foot .dedi{font-family:var(--font-serif); color:var(--ink-soft); font-size:13.5px; font-style:italic}

/* ---------- Plant photos ---------- */
.pimg{position:absolute; inset:0; width:100%; height:100%; object-fit:cover; display:block}
.pcard .top .pimg{border-radius:0; object-position:center 70%}
.pcard .top::after{content:""; position:absolute; inset:0; box-shadow:inset 0 0 0 1px rgba(255,255,255,.05); pointer-events:none}
.shot-cap{position:absolute; right:7px; bottom:7px; z-index:2; font-size:9.5px; font-weight:600; letter-spacing:.03em; color:#fff; background:rgba(20,28,16,.42); backdrop-filter:blur(3px); padding:2px 7px; border-radius:999px; pointer-events:none}

/* ---------- Identify: 拍照優先 ---------- */
.idcam{background:var(--surface); border:1px solid var(--border); border-radius:20px; box-shadow:0 4px 16px var(--shadow); padding:26px 20px 24px; text-align:center}
.idcam .ring{width:76px; height:76px; margin:0 auto 12px; border-radius:50%; background:var(--primary-soft); display:flex; align-items:center; justify-content:center}
.idcam .ring svg{width:38px; height:38px; color:var(--primary)}
.idcam h3{font-family:var(--font-serif); font-size:21px; margin:0 0 6px; font-weight:700}
.idcam p.lead{color:var(--ink-soft); font-size:14.5px; margin:0 auto 18px; max-width:34ch; line-height:1.6}
.idcam .btn-block+.btn-block{margin-top:10px}
.filebtn{position:relative; overflow:hidden}
.filebtn input[type=file]{position:absolute; inset:0; opacity:0; cursor:pointer; font-size:0}
#idPreview:empty{display:none}
.idshot{margin-top:16px; display:flex; gap:14px; text-align:left; background:var(--surface-2); border:1px solid var(--border-soft); border-radius:16px; padding:12px}
.idshot .thumb{width:96px; height:96px; flex:none; border-radius:12px; overflow:hidden; border:1px solid var(--border-soft); background:var(--bg-2)}
.idshot .thumb img{width:100%; height:100%; object-fit:cover; display:block}
.idshot .side{flex:1; min-width:0}
.idshot .side p{margin:0 0 9px; font-size:13.5px; color:var(--ink-soft); line-height:1.5}
.idshot .side p b{color:var(--ink)}
.idsteps{display:flex; flex-direction:column; gap:10px; margin-top:18px; text-align:left}
.idstep{display:flex; gap:12px; align-items:flex-start; background:var(--surface); border:1px solid var(--border-soft); border-radius:14px; padding:13px 15px}
.idstep .no{flex:none; width:24px; height:24px; border-radius:50%; background:var(--primary); color:#fff; font-size:13px; font-weight:700; display:flex; align-items:center; justify-content:center}
.idstep .tx{font-size:14px; line-height:1.55; color:var(--ink-soft)}
.idstep .tx b{color:var(--ink); font-weight:600}
.iddiv{display:flex; align-items:center; gap:12px; margin:20px 2px 4px; color:var(--ink-faint); font-size:12.5px; letter-spacing:.08em}
.iddiv::before,.iddiv::after{content:""; height:1px; flex:1; background:var(--border)}

@media (max-width:420px){
  .opts{grid-template-columns:1fr 1fr}
  .season .mo{font-size:44px}
  h2.section{font-size:22px}
  .idshot{flex-direction:column}
  .idshot .thumb{width:100%; height:150px}
}
/* ---------- 手機優先微調 ---------- */
@media (max-width:520px){
  body{font-size:17px; line-height:1.72}
  .app{padding:0 14px}
  .grid,.sgrid{grid-template-columns:repeat(2,1fr); gap:11px}
  .wx-temp{font-size:44px}
  .brand .en{font-size:18px}
  .brand .zh{font-size:11px; letter-spacing:.1em}
  .tab{font-size:11.5px}
}
@media (max-width:360px){
  .grid,.sgrid{grid-template-columns:1fr}
}

function wmoCond(c){
  c=+c;
  if(c===0) return '晴';
  if(c===1) return '晴時多雲';
  if(c===2) return '多雲';
  if(c===3) return '陰';
  if(c===45||c===48) return '有霧';
  if(c>=51&&c<=57) return '毛毛雨';
  if(c===61) return '小雨';
  if(c===63) return '陣雨';

  if(c===85||c===86) return '陣雪';
  if(c===95) return '雷陣雨';
  if(c>=96) return '雷雨冰雹';
  return '多雲';
}

async function liveWeather(){
  if(WX_FETCHING) return; WX_FETCHING=true;
  try{
    const ctl=new AbortController(); const to=setTimeout(()=>ctl.abort(),8000);
    const r=await fetch(WX_API,{cache:'no-store',signal:ctl.signal});
    clearTimeout(to);
    if(!r.ok) throw new Error('http');
    const j=await r.json();
    const d=j.daily;
    if(!d||!d.time||!d.time.length) throw new Error('empty');
    FORECAST.days=d.time.map((t,i)=>({
      d:t,
      hi:Math.round(d.temperature_2m_max[i]),
      lo:Math.round(d.temperature_2m_min[i]),
      pop:Math.round(d.precipitation_probability_max[i]==null?0:d.precipitation_probability_max[i]),
      fl:Math.round(d.apparent_temperature_max[i]==null?d.temperature_2m_max[i]:d.apparent_temperature_max[i]),
      cond:wmoCond(d.weather_code[i])
    }));
    FORECAST.updated=d.time[0];
    FORECAST.src='Open-Meteo 即時觀測';
    FORECAST.live=true;
    if(j.current){
      FORECAST.now={
        temp:Math.round(j.current.temperature_2m),
        fl:Math.round(j.current.apparent_temperature),
        cond:wmoCond(j.current.weather_code),
        at:String(j.current.time).slice(11,16)

    }

  }catch(e){
    FORECAST.live=false;
    try{ refreshAll(); }catch(_){}
  }finally{ WX_FETCHING=false; }
}

function wxKind(cond,pop){
  if(/雷/.test(cond)) return 'storm';
  if(/雨/.test(cond)){ return (pop>=60||/陰/.test(cond))?'rain':'showers'; }
  if(/陰/.test(cond)) return 'cloud';
  if(/晴/.test(cond)&&/多雲/.test(cond)) return 'suncloud';
  if(/多雲/.test(cond)) return 'cloud';
  if(/晴/.test(cond)) return 'sun';
  return 'suncloud';
}

function smoothPath(pts){
  if(pts.length<2) return pts.length?`M${pts[0][0]} ${pts[0][1]}`:'';
  let d=`M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
  for(let i=0;i<pts.length-1;i++){
    const p0=pts[i-1]||pts[i], p1=pts[i], p2=pts[i+1], p3=pts[i+2]||p2;
    const c1x=p1[0]+(p2[0]-p0[0])/6, c1y=p1[1]+(p2[1]-p0[1])/6;
    const c2x=p2[0]-(p3[0]-p1[0])/6, c2y=p2[1]-(p3[1]-p1[1])/6;
    d+=` C${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2[0].toFixed(1)} ${p2[1].toFixed(1)}`;
  }
  return d;
}
function wxTrend(days){
  const n=days.length; if(!n) return '';
  const W=340,padX=32, span=(n>1?(W-2*padX)/(n-1):0);
  const xs=days.map((_,i)=>padX+i*span);
  const his=days.map(d=>d.hi), los=days.map(d=>d.lo);
  const tMax=Math.max(...his)+2, tMin=Math.min(...los)-2, yTop=50,yBot=98;
  const Y=t=>yBot-(t-tMin)/((tMax-tMin)||1)*(yBot-yTop);
  const hiPts=xs.map((x,i)=>[x,Y(his[i])]), loPts=xs.map((x,i)=>[x,Y(los[i])]);
  const hiPath=smoothPath(hiPts);
  let s=`<path d="${hiPath} L${xs[n-1].toFixed(1)} 100 L${xs[0].toFixed(1)} 100 Z" fill="url(#wg-trend)"/>`;
  s+=`<path d="${smoothPath(loPts)}" fill="none" stroke="rgba(255,255,255,.4)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;
  s+=`<path d="${hiPath}" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>`;
  days.forEach((d,i)=>{
    const x=xs[i], p=d.d.split('-'), wd=['日','一','二','三','四','五','六'][new Date(+p[0],+p[1]-1,+p[2]).getDay()];
    s+=`<svg x="${(x-13).toFixed(1)}" y="4" width="26" height="26" viewBox="0 0 64 64">${wxShapes(wxKind(d.cond,d.pop))}</svg>`;
    s+=`<circle cx="${x.toFixed(1)}" cy="${Y(d.hi).toFixed(1)}" r="2.6" fill="#fff"/>`;
    s+=`<text x="${x.toFixed(1)}" y="${(Y(d.hi)-7).toFixed(1)}" text-anchor="middle" class="tr-hi">${d.hi}°</text>`;
    s+=`<text x="${x.toFixed(1)}" y="${(Y(d.lo)+13).toFixed(1)}" text-anchor="middle" class="tr-lo">${d.lo}°</text>`;
    s+=`<text x="${x.toFixed(1)}" y="121" text-anchor="middle" class="tr-day">${(+p[1])}/${(+p[2])} ${wd}</text>`;
    s+=`<text x="${x.toFixed(1)}" y="137" text-anchor="middle" class="tr-pop">💧${d.pop}%</text>`;
  });
  return `<svg class="wx-trend" viewBox="0 0 ${W} 148" preserveAspectRatio="xMidYMid meet" role="img" aria-label="未來 5 天氣溫趨勢">${s}</svg>`;
}
function weatherContext(){
  const F=(typeof FORECAST!=='undefined')&&FORECAST;
  if(!F||!F.days||!F.days.length) return {stale:true};
  const today=todayStr();
  let idx=F.days.findIndex(x=>x.d===today);
  if(idx<0){
    // 找不到今天（資料過期）→ 視為過期，退回月份基準
    return {stale:true, updated:F.updated};
  }
  const win=F.days.slice(idx,idx+3);
  const t=win[0];
  const maxPop=Math.max(...win.map(d=>d.pop||0));
  const avgHi=Math.round(win.reduce((a,d)=>a+d.hi,0)/win.length);
  const rainNear = (t.pop>=60)||(win[1]&&win[1].pop>=70);
  const hot = avgHi>=32;
  const cold = t.hi<=16;
  let sig;
  if(cold) sig='cold';
  else if(rainNear) sig='rain';
  else if(hot && t.pop<50) sig='dryhot';
  else sig='mild';
  return {stale:false, idx, win, t, maxPop, avgHi, hot, sig, updated:F.updated, loc:F.loc, src:F.src, days:F.days};
}

const $=(s,r=document)=>r.querySelector(s);

const pad2=n=>String(n).padStart(2,'0');

function daysSince(str){ if(!str) return null; const p=String(str).split('-').map(Number); if(p.length<3||!p[0]) return null; const a=new Date(p[0],p[1]-1,p[2]); const n=new Date(); const b=new Date(n.getFullYear(),n.getMonth(),n.getDate()); return Math.round((b-a)/86400000); }
function agoText(str){ const d=daysSince(str); if(d===null) return '尚未紀錄'; if(d<=0) return '今天'; if(d===1) return '昨天'; return d+' 天前'; }

/* ---------- SVG 植物插畫（依外觀參數生成） ---------- */
function leafBlob(cx,cy,r,fill){ return `<ellipse cx="${cx}" cy="${cy}" rx="${r}" ry="${r*0.92}" fill="${fill}"/>`; }
function shade(hex,amt){ // amt -1..1
  const n=parseInt(hex.slice(1),16); let r=(n>>16)&255,g=(n>>8)&255,b=n&255;
  const f=amt<0?(1+amt):1, t=amt>0?amt:0;
  r=Math.round(r*f+(255-r)*t); g=Math.round(g*f+(255-g)*t); b=Math.round(b*f+(255-b)*t);
  return '#'+((1<<24)+(r<<16)+(g<<8)+b).toString(16).slice(1);
}
function flowerDots(pts,color,rr){ const st = color==='#F4F1E6'?' stroke="#D8D2BE" stroke-width="0.7"':''; return pts.map(p=>`<circle cx="${p[0]}" cy="${p[1]}" r="${rr||3}" fill="${color}"${st}/>`).join(''); }
function drawPlant(p){
  const v=p.viz, fol=v.foliage, folD=shade(fol,-0.28), folL=shade(fol,0.22);
  const fc=FLOWER_HEX[v.flowerColor]||FLOWER_HEX.green;
  const pot=`<path d="M34 74 L66 74 L62 92 Q50 95 38 92 Z" fill="#B98A5E"/><path d="M32 70 L68 70 L66 76 L34 76 Z" fill="#CC9A6A"/>`;
  const soil=`<ellipse cx="50" cy="72" rx="16" ry="3.4" fill="#5A4632"/>`;
  let s='';
  const form=v.form;
  if(form==='tree'||form==='ficus'){
    s+=`<rect x="47.5" y="52" width="5" height="34" rx="2" fill="#8A6A44"/>`;
    s+=`<path d="M50 70 q-7 -4 -12 -2 M50 64 q8 -4 13 -1" stroke="#8A6A44" stroke-width="2.4" fill="none" stroke-linecap="round"/>`;
    s+=leafBlob(50,40,23,folD)+leafBlob(38,46,14,fol)+leafBlob(63,45,14,fol)+leafBlob(50,32,16,folL)+leafBlob(56,50,12,fol);
    if(v.leaf==='maple'){ s+=flowerDots([[42,34],[58,34],[50,26],[38,44],[62,44],[50,48]], '#C6532F',3.4); }
    if(v.flowerType==='cluster') s+=flowerDots([[40,36],[58,34],[50,28],[62,46],[38,48],[52,44]],fc,2.6);
    if(v.flowerType==='single') s+=flowerDots([[42,36],[60,42]],fc,4.6);
    if(v.flowerType==='spike') s+=flowerDots([[44,30],[50,26],[56,30],[41,40],[59,40]],fc,2.4);
    if(v.fruit) s+=flowerDots([[43,48],[58,50],[50,44],[62,42]],v.fruit,3.4);
  } else if(form==='shrub'){
    s+=leafBlob(50,60,22,folD)+leafBlob(35,62,13,fol)+leafBlob(65,62,13,fol)+leafBlob(43,48,15,fol)+leafBlob(58,47,15,folL)+leafBlob(50,40,13,folL);
    if(v.flowerType==='cluster') s+=flowerDots([[42,44],[57,42],[50,36],[35,58],[64,56],[48,52],[60,60]],fc,2.9);
    else if(v.flowerType==='ball'){ [[44,46],[58,44],[40,58],[60,58]].forEach(c=>{ s+=flowerDots([[c[0],c[1]],[c[0]-4,c[1]+1],[c[0]+4,c[1]+1],[c[0],c[1]-4],[c[0],c[1]+4]],fc,2.3); }); }
    else s+=flowerDots([[42,45],[59,47],[50,38]],fc,5); // single big
  } else if(form==='vine'){
    s+=`<path d="M32 90 L32 24 M50 90 L50 24 M68 90 L68 24" stroke="#C7B48F" stroke-width="1.4" opacity=".55"/><path d="M32 40 L68 40 M32 60 L68 60" stroke="#C7B48F" stroke-width="1.4" opacity=".55"/>`;
    s+=leafBlob(36,34,10,fol)+leafBlob(60,30,11,folL)+leafBlob(66,52,11,fol)+leafBlob(40,58,11,folD)+leafBlob(52,44,12,fol);
    s+=flowerDots([[34,30],[62,26],[68,50],[38,56],[54,40],[46,52]],fc,3.4);
  } else if(form==='bamboo'){
    for(const x of [40,50,60]){ s+=`<rect x="${x-2.2}" y="20" width="4.4" height="66" rx="2" fill="${x===50?folD:fol}"/>`;
      for(const y of [38,54,70]) s+=`<rect x="${x-2.6}" y="${y}" width="5.2" height="2" rx="1" fill="${shade(fol,-0.4)}"/>`; }
    s+=`<path d="M40 30 q-12 -6 -18 -2 M50 24 q10 -8 20 -6 M60 34 q12 -4 16 2 M40 46 q-14 -2 -18 4" stroke="${folL}" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  } else if(form==='succulent'){
    s+=pot+soil;
    const cx=50,cy=64; const pet=[[0,-10],[7,-7],[10,0],[7,7],[0,9],[-7,7],[-10,0],[-7,-7]];
    pet.forEach((d,i)=>{ s+=`<ellipse cx="${cx+d[0]}" cy="${cy+d[1]}" rx="6.4" ry="3.6" fill="${i%2?folL:fol}" transform="rotate(${i*45} ${cx+d[0]} ${cy+d[1]})"/>`; });
    s+=`<ellipse cx="${cx}" cy="${cy}" rx="6" ry="5" fill="${folD}"/>`;
    s+=`<ellipse cx="${cx}" cy="${cy-1}" rx="2.6" ry="2.2" fill="${folL}"/>`;
  } else if(form==='herb'){
    s+=pot+soil;
    for(const x of [42,50,58]){ s+=`<path d="M${x} 70 C${x-6} 58 ${x-4} 46 ${x} 40" stroke="${fol}" stroke-width="2" fill="none" stroke-linecap="round"/>`;
      for(let k=0;k<3;k++){ const yy=64-k*8; s+=`<ellipse cx="${x-5}" cy="${yy}" rx="4" ry="2.2" fill="${folL}" transform="rotate(-30 ${x-5} ${yy})"/><ellipse cx="${x+4}" cy="${yy-3}" rx="4" ry="2.2" fill="${folD}" transform="rotate(30 ${x+4} ${yy-3})"/>`; } }
    if(v.flowerType==='spike') s+=flowerDots([[42,38],[50,34],[58,38]],fc,2.4);
  } else if(form==='orchid'){
    s+=pot+soil;
    s+=`<path d="M44 70 q-10 -6 -8 -18 M56 70 q10 -6 8 -18" stroke="${folD}" stroke-width="6" fill="none" stroke-linecap="round"/>`;
    s+=`<path d="M50 62 C58 50 60 34 54 22" stroke="#7C6A3E" stroke-width="1.6" fill="none"/>`;
    s+=flowerDots([[54,22],[52,30],[57,30],[50,40],[59,40]],fc,4.4);
  } else { // pot (default 盆栽)
    s+=pot+soil;
    if(v.leaf==='big'){ s+=`<path d="M50 68 C34 60 30 40 40 28 C46 40 48 40 50 66 Z" fill="${fol}"/><path d="M50 68 C66 58 70 38 60 26 C54 40 52 42 50 66 Z" fill="${folD}"/><path d="M50 66 C50 50 50 38 50 26" stroke="${folL}" stroke-width="1.4"/>`; }
    else { s+=leafBlob(50,50,17,folD)+leafBlob(40,54,10,fol)+leafBlob(60,54,10,fol)+leafBlob(50,40,11,folL);
      if(v.flowerType==='cluster') s+=flowerDots([[43,42],[57,42],[50,35],[46,50],[58,50]],fc,2.7);
      if(v.fruit) s+=flowerDots([[43,52],[57,52],[50,46]],v.fruit,3.6);
    }
  }
  return `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${p.name}插畫">${s}</svg>`;
}

const fmtMD=s=>{const p=String(s).split('-');return p.length>=3?(+p[1])+'/'+(+p[2]):s;};
function wxDeco(sig){ const k=sig==='rain'?'rain':sig==='dryhot'?'sun':sig==='cold'?'cloud':'suncloud'; return `<div class="wx-bigdeco">${wxSVG(k)}</div>`; }

function renderSeason(m){

/* ---------- 本週待辦 ---------- */
function waterForMonth(p,m){
  const b=MONTH_BUCKET[m]; const base=WATER_BASE[p.wlevel][b];
  return {drops:base[0],fq:base[1].replace(/<br>/g,' '),note:(p.wnote&&p.wnote[m])||''};
}
function fertForMonth(p,m){ const out=[]; (p.fwin||[]).forEach(w=>{ if(w.mo.includes(m)) out.push(w.do); }); return out; }
/* 依季節需水量估算「幾天該澆一次」，並找出久未澆水的植物（全部在本機計算） */
function wateringInterval(p,m){ const w=waterForMonth(p,m); return w.drops>=3?1:(w.drops===2?4:8); }
function dueInfo(id,m){
  const p=PLANT_BY_ID[id],g=STATE.garden[id]; if(!p||!g) return null;
  const every=wateringInterval(p,m);
  const last=(g.water&&g.water.length)?g.water[g.water.length-1]:null;
  const d=daysSince(last||g.added); if(d===null) return null;
  return {id,name:p.name,every,days:d,last,never:!last,over:d-every};
}
function dueList(m){ return Object.keys(STATE.garden).map(id=>dueInfo(id,m)).filter(x=>x&&x.over>=0).sort((a,b)=>b.over-a.over); }
function waterAll(){
  const ids=Object.keys(STATE.garden); if(!ids.length) return;
  const t=todayStr(); let n=0;
  ids.forEach(id=>{ const g=STATE.garden[id]; const arr=g.water||(g.water=[]); if(arr[arr.length-1]!==t){ arr.push(t); n++; } });
  save(); toast(n?('已記錄全部澆水 💧 · '+n+' 種'):'今天都已經記錄過了 🌿'); refreshAll();
}

    const acts = showLog?`<div class="qacts">

      </div>`:'';
    return `<div class="task"><div class="pic" data-open="${id}">${plantImg(p)}</div>

        <div class="lines">${lines}</div>${lastLine}${acts}</div></div>`;
  }).join('');
  const due = m===now ? dueList(m) : [];
  const dueBanner = due.length ? `<div class="due-banner" role="alert">
      <div class="db-top"><span class="db-ic">💧</span><b>該澆水了 · ${due.length} 種</b></div>

  const headBtn = (m===now && ids.length && !due.length) ? `<button class="btn-waterall" data-waterall>💧 全部記錄今天澆水</button>` : '';
  const label = m===now?'本週待辦':`${m} 月 · 照護預覽`;
  wrap.innerHTML = dueBanner + `<div class="todo-head"><h3>${label}</h3><span class="count">${ids.length} 種植物</span>${headBtn}</div>
    <div class="card">${items}</div>
    ${m===now?'':'<p class="log-note" style="margin-top:10px">切換回本月即可打勾記錄澆水、施肥。</p>'}`;
}

/* ---------- 我的花園 ---------- */
function stateChips(id){
  const g=STATE.garden[id]; const p=PLANT_BY_ID[id]; const m=curMonth();
  const chips=[];
  const w=waterForMonth(p,m);
  const dW=g.water&&g.water.length?daysSince(g.water[g.water.length-1]):null;
  // 粗略判斷是否「該澆水」：依季節建議天數
  const approxEvery = w.drops>=3?1:(w.drops===2?4:8);
  if(dW===null) chips.push('<span class="pill due">待澆水</span>');
  else if(dW>=approxEvery) chips.push('<span class="pill due">💧 該澆水了</span>');
  else chips.push(`<span class="pill ok">💧 ${agoText(g.water[g.water.length-1])}澆過</span>`);
  return chips.join(' ');
}

/* ---------- 匯出到手機日曆（Google 日曆重複提醒；連結只帶植物名稱） ---------- */
function gcalLink(title,details,rrule){
  const t=todayStr().replace(/-/g,'');
  const p=new URLSearchParams();
  p.set('action','TEMPLATE'); p.set('text',title); p.set('details',details);
  p.set('dates',t+'T080000/'+t+'T081500'); p.set('ctz','Asia/Taipei'); p.set('recur','RRULE:'+rrule);
  return 'https://calendar.google.com/calendar/render?'+p.toString();
}
function exportBuckets(m){
  const groups={}; Object.keys(STATE.garden).forEach(id=>{ const p=PLANT_BY_ID[id]; if(!p) return; const e=wateringInterval(p,m); (groups[e]||(groups[e]=[])).push(p.name); });
  const defs=[
    {every:1,label:'每天澆水',rrule:'FREQ=DAILY',hint:'夏天需水多的香草、花木'},
    {every:4,label:'每 3–4 天澆水',rrule:'FREQ=DAILY;INTERVAL=4',hint:''},
    {every:8,label:'約每週澆水一次',rrule:'FREQ=WEEKLY',hint:'耐旱類，先確認土全乾再澆'}
  ];
  return defs.map(d=>Object.assign({},d,{plants:groups[d.every]||[]})).filter(d=>d.plants.length);
}
function openCalendarExport(){
  const m=curMonth(); const buckets=exportBuckets(m);
  const rows=buckets.map(b=>{
    const names=b.plants.join('、');
    const details='Gracie\'s Garden 澆水提醒\n這些植物：'+names+'\n'+(b.hint?('（'+b.hint+'）\n'):'')+'詳細澆水方式請開 Gracie\'s Garden 查看。';
    const link=gcalLink('💧 澆水提醒（'+b.label.replace('澆水','')+'）',details,b.rrule);
    return '<div class="cal-row"><div class="cal-info"><div class="cal-when">💧 '+b.label+'</div><div class="cal-plants">'+names+'</div></div>'
      +'<a class="btn-gcal" href="'+link+'" target="_blank" rel="noopener">加入 Google 日曆</a></div>';
  }).join('');
  const body=buckets.length
    ? '<div class="dsec"><p>依 Grace 花園裡植物<b>目前季節</b>的澆水頻率分組。每組按一下，就會在 Google 日曆建立一個會重複的澆水提醒（含通知），App 關著也會提醒。</p></div><div class="cal-list">'+rows+'</div>'
      +'<div class="callout" style="margin-top:14px"><b>用 iPhone 內建行事曆？</b> 一樣點「加入 Google 日曆」，用 Google 帳號登入後，行事曆會自動同步到 iPhone。<br><span style="color:var(--ink-faint);font-size:12px">入冬等季節變化時澆水頻率會改變，回來重新匯出一次即可。提醒只帶植物名稱，其他紀錄仍只留在這支手機。</span></div>'
    : '<div class="dsec"><p>花園還沒有植物。先到「圖鑑」加入 Grace 花園裡的植物，再回來匯出提醒。</p></div>';
  $('#sheet').innerHTML='<div class="sheet-scroll">'
    +'<div class="hero"><div class="grip"></div><button class="icon-btn close" id="sheetClose" aria-label="關閉">✕</button>'
    +'<div class="hero-row"><div><h2>匯出手機提醒</h2><div class="al">加到 Google 日曆 · App 關著也會提醒</div></div></div></div>'
    +'<div class="dbody">'+body+'</div></div>';
  $('#scrim').classList.add('show'); requestAnimationFrame(()=>$('#sheet').classList.add('show'));
  document.body.style.overflow='hidden';

function scorePlant(p){
  const f=p.idf; let s=0;
  const ADJ={tree:['shrub'],shrub:['pot','tree','vine'],vine:['shrub'],pot:['shrub','herb','succulent'],herb:['pot'],succulent:['pot']};
  if(wz.form){ if(f.form.includes(wz.form)) s+=4; else if((ADJ[wz.form]||[]).some(x=>f.form.includes(x))) s+=1.2; }
  const cols=[...wz.colors];
  if(cols.length){
    if(cols.includes('none')){ if(!f.flower) s+=3.5; else s-=1.5; }
    const real=cols.filter(c=>!['none','unsure'].includes(c));
    let cm=0; real.forEach(c=>{ if(c==='purple'){ if(f.colors.includes('purple')||f.colors.includes('blue')) cm++; } else if(f.colors.includes(c)) cm++; });
    s+=Math.min(cm*2,4);
    if(real.length && f.flower && cm===0) s-=0.5;
  }
  [...wz.feats].forEach(ft=>{
    if(ft==='unsure') return;
    if(ft==='deciduous'){ if(!f.evergreen) s+=1.6; }
    else if(f[ft]) s+=1.6;
  });
  return s;
}
function renderResult(){
  wz.step=3;
  const scored=PLANTS.map(p=>({p,s:scorePlant(p)})).sort((a,b)=>b.s-a.s);
  const top=Math.max(scored[0].s,0.001);
  const show=scored.filter(x=>x.s>0).slice(0,6);
  const list=(show.length?show:scored.slice(0,4)).map((x,i)=>{
    const p=x.p; const pct=Math.max(12,Math.round(x.s/top*100));
    const lvl=i===0&&x.s>0?'最相符':(pct>=60?'很相似':'可能');
    return `<button class="pcard" data-open="${p.id}" style="margin-bottom:0">
      <div class="top"><span class="cat">${i===0?'⭐ '+lvl:lvl}</span>${plantImg(p)}</div>
      <div class="meta"><div class="nm">${p.name}</div><div class="al">${p.alias}</div>
        <div class="matchbar"><i style="width:${pct}%"></i></div></div></button>`;
  }).join('');
  $('#wizardWrap').innerHTML=`<div class="wizard">
    <div class="match-hd"><p class="wq" style="margin:0">最可能的植物</p><span class="n">點卡片看照顧方式</span></div>
    <div class="grid">${list}</div>
    <div class="wtip" style="margin-top:18px">🌿 找到了嗎？點進卡片就能「加入我的花園」。<br>還是不確定？可以先加入最像的，或拍照用「形色 PictureThis」等 App 再確認。</div>
    <div class="wnav"><button class="btn btn-soft btn-block" id="wRestart">↺ 重新辨識</button></div></div>`;
}

function renderFert(){
  const EFF={N:'🌿 長葉·翠綠',P:'🌸 長根·開花',K:'🍅 結果·強壯',Ca:'🛡️ 硬實·防病'};
  const core=FERT.filter(f=>EFF[f.sym]);
  const tiles=core.map(f=>`<div class="ftile" style="--fc:${f.color}">
      <div class="ft-head"><span class="fsym sm">${f.sym}</span><span class="ft-name">${f.zh}</span></div>
      <div class="ft-eff">${EFF[f.sym]}</div>
      <div class="ft-src">${f.sources.slice(0,3).map(s=>FIMG[s.n]?`<img class="ftmini" src="${FIMG[s.n]}" alt="" loading="lazy">`:`<span>${s.e}</span>`).join('')}</div>
    </div>`).join('');
  const cards=FERT.map(f=>`<div class="fcard" style="--fc:${f.color}">
      <div class="fhead"><span class="fsym">${f.sym}</span>
        <div><div class="fname">${f.zh}</div><div class="frole">${f.role}</div></div></div>
      <div class="ffor">🌱 適合：${f.use}</div>
      <div class="sgrid">${f.sources.map(s=>`<div class="scard">${FIMG[s.n]?`<div class="stop"><img class="spimg" src="${FIMG[s.n]}" alt="${s.n}" loading="lazy"></div>`:`<div class="stop noimg">${s.e}</div>`}<div class="smeta"><div class="snm">${s.n}</div><div class="sone">${s.u}</div></div></div>`).join('')}</div>
    </div>`).join('');
  $('#fertWrap').innerHTML=
     `<div class="fglance"><div class="fglance-h">🌱 四大肥分一覽</div><div class="fgrid">${tiles}</div>`
    +`<div class="fglance-note">色塊＝肥分種類，下排圖示＝主要家用來源；往下看每種的完整來源與用法。</div></div>`
    +`<div class="callout" style="margin:0 0 8px"><b>共通原則：</b>薄肥勤施、寧淡勿濃；大多要先曬乾或發酵，生的直接埋土容易發霉、發熱燒根、招小蟲。天然肥是「慢慢養」，不會馬上見效。</div>`
    +`<div class="fdetail-h">各肥分的來源與用法</div>`
    +cards
    +`<div class="callout warn" style="margin-top:4px"><b>小提醒：</b>要食用的植物用有機廚餘肥最安心；草木灰偏鹼，杜鵑、山茶、藍莓等喜酸植物少用；室內盆栽直接埋生廚餘容易有異味、小蟲，建議先在戶外堆肥腐熟再用。</div>`;
}

function renderTabs(){
  $('#tabbar').innerHTML=TABS.map(t=>`<button class="tab ${t.v==='month'?'on':''}" data-tab="${t.v}"><svg viewBox="0 0 24 24">${t.icon}</svg>${t.lb}</button>`).join('');
}
function switchTab(v){
  $$('.view').forEach(x=>x.classList.remove('active')); $('#view-'+v).classList.add('active');
  $$('.tab').forEach(x=>x.classList.toggle('on',x.dataset.tab===v));
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ---------- Toast ---------- */
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),2200); }

/* ---------- Theme ---------- */
function applyTheme(){ document.documentElement.setAttribute('data-theme','light'); }

/* ---------- refresh ---------- */
function refreshAll(){ renderSeason(curMonth()); renderTodo(curMonth()); renderGarden(); renderLibrary(); }

/* ---------- init ---------- */
function init(){
  applyTheme();
  renderTabs(); renderSeason(curMonth()); renderTodo(curMonth());
  renderGarden(); renderLibFilter(); renderLibrary(); renderFert();

  document.addEventListener('click',e=>{
    const t=e.target.closest('[data-tab],[data-go],[data-open],[data-add],[data-remove],[data-log],[data-waterall],[data-calexport],[data-cat],[data-form],[data-color],[data-feat],#wNext,#wBack,#wResult,#wRestart,#idWizard,#idBackCam,#sheetClose,#sheetDone');
    if(!t) return;
    if(t.dataset.tab){ switchTab(t.dataset.tab); return; }
    if(t.dataset.go){ switchTab(t.dataset.go); return; }
    if(t.dataset.open){ openSheet(t.dataset.open); return; }
    if(t.dataset.add){ addPlant(t.dataset.add); closeSheet(); switchTab('garden'); return; }
    if(t.dataset.remove){ removePlant(t.dataset.remove); closeSheet(); return; }
    if(t.dataset.log){ logCare(t.dataset.id,t.dataset.log); return; }
    if(t.dataset.waterall!==undefined){ waterAll(); return; }
    if(t.dataset.calexport!==undefined){ openCalendarExport(); return; }
    if(t.id==='sheetClose'||t.id==='sheetDone'){ closeSheet(); return; }
    if(t.dataset.cat){ libCat=t.dataset.cat; renderLibFilter(); renderLibrary(); return; }
    // wizard
    if(t.dataset.form!==undefined && t.dataset.form){ wz.form=t.dataset.form; renderWizard(); return; }
    if(t.dataset.color!==undefined && t.dataset.color){ const v=t.dataset.color; if(v==='none'||v==='unsure'){ wz.colors.has(v)?wz.colors.delete(v):(wz.colors.clear(),wz.colors.add(v)); } else { wz.colors.delete('none'); wz.colors.delete('unsure'); wz.colors.has(v)?wz.colors.delete(v):wz.colors.add(v); } renderWizard(); return; }
    if(t.dataset.feat!==undefined && t.dataset.feat){ const v=t.dataset.feat; if(v==='unsure'){ wz.feats.clear(); wz.feats.add(v);} else { wz.feats.delete('unsure'); wz.feats.has(v)?wz.feats.delete(v):wz.feats.add(v);} renderWizard(); return; }
    if(t.id==='wNext'){ if(wz.step===0&&!wz.form) return; wz.step=Math.min(2,wz.step+1); renderWizard(); return; }
    if(t.id==='wBack'){ wz.step=Math.max(0,wz.step-1); renderWizard(); return; }
    if(t.id==='wResult'){ renderResult(); return; }
    if(t.id==='wRestart'){ wz={step:0,form:null,colors:new Set(),feats:new Set()}; renderWizard(); return; }
    if(t.id==='idWizard'){ idMode='wizard'; wz={step:0,form:null,colors:new Set(),feats:new Set()}; renderIdentify(); window.scrollTo({top:0,behavior:'smooth'}); return; }
    if(t.id==='idBackCam'){ idMode='home'; renderIdentify(); window.scrollTo({top:0,behavior:'smooth'}); return; }
  });
  document.addEventListener('input',e=>{
    if(e.target && e.target.id==='libSearch'){ libQuery=e.target.value; renderLibrary(); }
  });
  $('#scrim').addEventListener('click',e=>{ if(e.target===$('#scrim')) closeSheet(); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape') closeSheet(); });
}
init();
liveWeatherTick();

</script>

</body>
</html>
